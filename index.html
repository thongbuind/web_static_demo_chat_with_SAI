<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SAI — Chat</title>
<script src="theme.js"></script>
<link rel="stylesheet" href="theme.css">
<link rel="stylesheet" href="ui-foundation.css">
<link rel="stylesheet" href="chat.css">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Cormorant+Garamond:ital@1&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
</head>
<body>

<canvas id="bg-canvas"></canvas>

<!-- ===== SIDEBAR ===== -->
<div id="sidebar" class="closed glass-elevated">

  <div id="sidebar-header">
    <button id="sidebar-toggle" class="glass-control" onclick="toggleSidebar()" title="Toggle sidebar">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M9 3v18"/></svg>
    </button>
    <div id="sidebar-title">Lịch sử chat</div>
    <button id="home-btn" type="button" onclick="toggleTheme()" title="Đổi giao diện sáng/tối" aria-label="Đổi giao diện sáng/tối">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.42 1.42M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.42-1.42M17.66 6.34l1.41-1.41"/></svg>
    </button>
  </div>

  <!-- Saved-chat source -->
  <div id="sidebar-tabs">
    <button id="tab-mine" class="sidebar-tab active">Chat đã lưu</button>
  </div>

  <div id="history-list"></div>
</div>

<!-- Floating toggle when sidebar is closed -->
<button id="sidebar-open-btn" class="glass-control" onclick="toggleSidebar()" title="Open sidebar">
  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M9 3v18"/></svg>
</button>

<!-- ===== MAIN ===== -->
<div id="main">

  <div id="chat" class="visible"></div>
</div>

<script src="demo_chat.js"></script>
<script>
// ===== POINT CLOUD =====
const canvas = document.getElementById("bg-canvas")
const ctx = canvas.getContext("2d")
let W, H, points
const POINT_COUNT = 540
const MOUSE = { x: -9999, y: -9999 }

function resize() { W = canvas.width = window.innerWidth; H = canvas.height = window.innerHeight }

const PARTICLE_COLOR_TOKENS = [
  "--color-particle-1",
  "--color-particle-2",
  "--color-particle-3",
  "--color-particle-4",
  "--color-particle-5",
  "--color-particle-6",
]
const PARTICLE_ALPHA_RANGE = [0.1, 0.55]

function getColors() {
  const style = getComputedStyle(document.documentElement)
  return PARTICLE_COLOR_TOKENS
    .map(token => style.getPropertyValue(token).trim().replace(/\s+/g, ","))
    .filter(Boolean)
}

window.addEventListener('sai-theme-change', () => initPoints())

function initPoints() {
  const COLORS = getColors()
  points = Array.from({ length: POINT_COUNT }, () => ({
    x: Math.random() * W, y: Math.random() * H,
    vx: (Math.random() - 0.5) * 1.2, vy: (Math.random() - 0.5) * 1.2,
    r: Math.random() * 2 + 0.4,
    color: COLORS[Math.floor(Math.random() * COLORS.length)],
    alpha: Math.random() * (PARTICLE_ALPHA_RANGE[1] - PARTICLE_ALPHA_RANGE[0]) + PARTICLE_ALPHA_RANGE[0],
    wx: Math.random() * Math.PI * 2, wy: Math.random() * Math.PI * 2,
    wsx: (Math.random() * 0.008 + 0.003) * (Math.random() < 0.5 ? 1 : -1),
    wsy: (Math.random() * 0.008 + 0.003) * (Math.random() < 0.5 ? 1 : -1),
    wax: Math.random() * 0.6 + 0.2, way: Math.random() * 0.6 + 0.2,
  }))
}

function draw() {
  ctx.clearRect(0, 0, W, H)
  for (const p of points) {
    p.wx += p.wsx; p.wy += p.wsy
    p.x += p.vx + Math.sin(p.wx) * p.wax
    p.y += p.vy + Math.cos(p.wy) * p.way
    if (p.x < -10) p.x = W + 10
    if (p.x > W + 10) p.x = -10
    if (p.y < -10) p.y = H + 10
    if (p.y > H + 10) p.y = -10
    const dx = p.x - MOUSE.x, dy = p.y - MOUSE.y
    const dist = Math.sqrt(dx*dx + dy*dy)
    if (dist < 120 && dist > 0) { const f = (120-dist)/120; p.x += (dx/dist)*f*1.4; p.y += (dy/dist)*f*1.4 }
    ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI*2)
    ctx.fillStyle = `rgba(${p.color}, ${p.alpha})`; ctx.fill()
  }
  requestAnimationFrame(draw)
}
window.addEventListener("mousemove", e => { MOUSE.x = e.clientX; MOUSE.y = e.clientY })
window.addEventListener("mouseleave", () => { MOUSE.x = -9999; MOUSE.y = -9999 })
window.addEventListener("resize", () => { resize(); initPoints() })
resize(); initPoints(); draw()
</script>
</body>
</html>
